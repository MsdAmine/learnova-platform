spring:
  application:
    name: learnova-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnova_db}
    username: ${DB_USERNAME:learnova_user}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  servlet:
    multipart:
      # Above the largest accepted upload (5MB course thumbnails) so oversized
      # requests are rejected by MediaValidator with a clear 400, not a generic
      # container-level multipart exception.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never leak Java stack traces in error response bodies (defense in depth).
    include-stacktrace: never
    # Surface the ResponseStatusException reason (e.g. "Course not found") so
    # 404/409 responses stay useful without exposing internals.
    include-message: always

app:
  security:
    jwt:
      secret: ${JWT_SECRET:learnova-development-secret-key-for-jwt-authentication-minimum-32-characters}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}