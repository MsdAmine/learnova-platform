spring:
  datasource:
    url: jdbc:h2:mem:learnova_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  security:
    jwt:
      secret: learnova-test-secret-key-for-jwt-authentication-minimum-32-characters
      expiration-ms: 86400000